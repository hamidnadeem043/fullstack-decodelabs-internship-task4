<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <body>

  
  <header>
    <div>
      <h1>👥 User Management System</h1>
      <p>DecodeLabs Internship — Project 4 | Full Stack Development</p>
    </div>
  </header>

  <div class="container">

    <div class="stats">
      <div class="stat-box">
        <div class="number" id="totalUsers">0</div>
        <div class="label">Total Users</div>
      </div>
      <div class="stat-box">
        <div class="number" id="lastAdded">—</div>
        <div class="label">Last Added</div>
      </div>
    </div>


    <div class="card">
      <h2>➕ Add New User</h2>

      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="name" placeholder="e.g. Ali Hassan">
      </div>

      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="email" placeholder="e.g. ali@gmail.com">
      </div>

      <div class="form-group">
        <label>Age</label>
        <input type="number" id="age" placeholder="e.g. 22" min="1" max="120">
      </div>

      <button class="btn btn-green" onclick="addUser()">
        Add User
      </button>

      <!-- Success/Error message yahan dikhega -->
      <div class="message" id="formMessage"></div>
    </div>

   
    <div class="card">
      <h2>📋 All Users</h2>

      <div id="usersContainer">
        <div class="loading">Loading users...</div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
